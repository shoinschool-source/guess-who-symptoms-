<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Illness - Welcome</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
        }
        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
            border-top: 8px solid #2b4c7e;
        }
        h1 {
            color: #2b4c7e;
            margin-top: 0;
            font-size: 28px;
        }
        p {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .qr-wrapper {
            background: #fff;
            padding: 15px;
            border: 3px solid #2b4c7e;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 30px;
        }
        .qr-wrapper span {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #2b4c7e;
            margin-bottom: 10px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
        }
        .start-btn {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
            box-sizing: border-box;
        }
        .start-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Guess the Illness!</h1>
        <p>Scan the code below with your phone or tablet to open your interactive student card board.</p>

        <div class="qr-wrapper">
            <span>STUDENT BOARD QR CODE</span>
            <div id="qrcode"></div>
        </div>

        <a href="teacher_game.html" class="start-btn">Start Game (Teacher Screen) ➡️</a>
    </div>

    <script>
        function generateQRCode() {
            document.getElementById("qrcode").innerHTML = "";
            let studentUrl = window.location.href.replace("index.html", "student_card.html");
            
            new QRCode(document.getElementById("qrcode"), {
                text: studentUrl,
                width: 150,
                height: 150,
                colorDark: "#2b4c7e",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        window.onload = generateQRCode;
    </script>
</body>
</html>
