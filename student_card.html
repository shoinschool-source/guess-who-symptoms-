<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病気を当てよう！ - 生徒用カード</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 660px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h1 { color: #2b4c7e; margin: 0; font-size: 20px; }
        .score-container {
            display: flex;
            gap: 8px;
        }
        .score-board, .streak-board {
            background: #ffffff;
            border: 2px solid #27ae60;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #27ae60;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .streak-board { border-color: #d89e00; color: #d89e00; }
        
        .round-indicator { font-size: 14px; font-weight: bold; color: #2980b9; margin-bottom: 10px; text-align: center; }
        #instructions { font-size: 13px; color: #555; margin-bottom: 15px; text-align: center; max-width: 600px; line-height: 1.4; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            width: 150px;
            height: 170px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.03); }
        .card.eliminated { background-color: #d1d8e0; opacity: 0.5; }
        .card.eliminated::after {
            content: '❌';
            position: absolute;
            font-size: 70px;
            color: rgba(220, 50, 50, 0.7);
            top: 40px;
        }
        .avatar { width: 55px; height: 55px; border-radius: 50%; background-color: #ffdcb1; margin-top: 5px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .name { font-weight: bold; font-size: 15px; margin-bottom: 2px; }
        .symptoms-text { font-size: 10px; color: #666; text-align: center; margin-bottom: 4px; line-height: 1.2; }
        
        .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 400px; }
        .guess-box { display: flex; gap: 10px; width: 100%; justify-content: center; }
        select { padding: 10px; font-size: 15px; border-radius: 5px; border: 2px solid #2980b9; flex-grow: 1; background-color: #fff; }
        button { border: none; padding: 10px 16px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; color: white; }
        button.submit-btn { background-color: #27ae60; }
        button.submit-btn:hover { background-color: #219653; }
        button.reset-board { background-color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>患者ボード (<span id="playerNameDisplay">ゲスト</span>)</h1>
        <div class="score-container">
            <div class="streak-board">🔥 連続: <span id="streakDisplay">0</span></div>
            <div class="score-board">🏆 スコア: <span id="scoreDisplay">0</span></div>
        </div>
    </div>
    
    <div class="round-indicator" id="roundIndicator">読み込み中...</div>

    <div id="instructions">
        先生がゲームを開始するのをお待ちください...
    </div>

    <div class="grid" id="studentGrid" style="display: none;"></div>

    <div class="controls" style="display: none;">
        <div class="guess-box">
            <select id="characterSelect">
                <option value="" disabled selected>-- キャラクターを選ぶ --</option>
            </select>
            <button class="submit-btn" onclick="submitGuess()">決定する ✅</button>
        </div>
        <div id="guessStatusMsg" style="color: #e21b3c; font-weight: bold; font-size: 13px; min-height: 18px;"></div>
        <button class="reset-board" onclick="resetBoard()">ボードをリセット ❌</button>
    </div>

    <script>
        const characters = [
            { name: "Tom", fever: true, cough: false, soreThroat: false, stomachache: false },
            { name: "Anna", fever: false, cough: true, soreThroat: false, stomachache: false },
            { name: "Leo", fever: false, cough: false, soreThroat: true, stomachache: false },
            { name: "Mia", fever: false, cough: false, soreThroat: false, stomachache: true },
            { name: "Ben", fever: true, cough: true, soreThroat: false, stomachache: false },
            { name: "Sara", fever: true, cough: false, soreThroat: true, stomachache: false },
            { name: "Dan", fever: true, cough: false, soreThroat: false, stomachache: true },
            { name: "Emma", fever: false, cough: true, soreThroat: true, stomachache: false },
            { name: "Noah", fever: false, cough: true, soreThroat: false, stomachache: true },
            { name: "Zoe", fever: false, cough: false, soreThroat: true, stomachache: true },
            { name: "Liam", fever: true, cough: true, soreThroat: true, stomachache: false },
            { name: "Olivia", fever: true, cough: true, soreThroat: false, stomachache: true },
            { name: "Lucas", fever: true, cough: false, soreThroat: true, stomachache: true },
            { name: "Chloe", fever: false, cough: true, soreThroat: true, stomachache: true },
            { name: "Mason", fever: true, cough: true, soreThroat: true, stomachache: true },
            { name: "Ava", fever: false, cough: false, soreThroat: false, stomachache: false }
        ];

        let roundSecretNames = [];
        let currentStudentRound = 0;
        let eliminatedStatus = {};
        let studentScore = 0;
        let studentStreak = 0;
        let roomPin = "1234";
        let playerName = "ゲスト";
        
        let lastKnownGameStep = -1;
        let lastKnownHintIndex = -1;
        let hasGuessedCurrentHint = false;

        function initStudentBoard() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('rounds')) {
                roundSecretNames = urlParams.get('rounds').split(",").map(n => n.trim());
            } else {
                roundSecretNames = ["Tom", "Anna", "Leo", "Mia", "Ben", "Sara"];
            }

            if (urlParams.has('pin')) {
                roomPin = urlParams.get('pin');
            }

            let pName = prompt("ニックネームを入力してください：", "生徒");
            if (pName && pName.trim() !== "") {
                playerName = pName.trim();
            }
            document.getElementById("playerNameDisplay").innerText = playerName;

            currentStudentRound = 0;
            studentScore = 0;
            studentStreak = 0;
            document.getElementById("scoreDisplay").innerText = studentScore;
            document.getElementById("streakDisplay").innerText = studentStreak;
            
            populateDropdown();
            resetBoardState();
            syncScore();
            startPolling();
        }

        function populateDropdown() {
            const select = document.getElementById("characterSelect");
            select.innerHTML = '<option value="" disabled selected>-- キャラクターを選ぶ --</option>';
            characters.forEach(c => {
                let opt = document.createElement("option");
                opt.value = c.name;
                opt.innerText = c.name;
                select.appendChild(opt);
            });
        }

        function resetBoardState() {
            characters.forEach(c => eliminatedStatus[c.name] = false);
            renderStudentGrid();
        }

        function updateRoundIndicator() {
            let indicator = document.getElementById("roundIndicator");
            if (currentStudentRound < roundSecretNames.length) {
                indicator.innerText = `ラウンド ${currentStudentRound + 1} / ${roundSecretNames.length}`;
            } else {
                indicator.innerText = `🏆 全ラウンド終了！ 最終スコア: ${studentScore} 点`;
            }
        }

        function startPolling() {
            setInterval(async () => {
                try {
                    let res = await fetch(`/api/game-step?roomPin=${roomPin}`);
                    let data = await res.json();
                    if (data.gameStep !== undefined && data.gameStep !== lastKnownGameStep) {
                        lastKnownGameStep = data.gameStep;
                        renderViewBasedOnStep(data.gameStep);
                    }
                } catch(e) {}
            }, 2000);

            setInterval(async () => {
                if (lastKnownGameStep < 2) return;
                try {
                    let res = await fetch(`/api/hint-state?roomPin=${roomPin}`);
                    let data = await res.json();
                    if (data.hintIndex !== undefined && data.hintIndex !== lastKnownHintIndex) {
                        lastKnownHintIndex = data.hintIndex;
                        hasGuessedCurrentHint = false;
                        setGuessLock(false, "");
                    }
                } catch(e) {}
            }, 2000);
        }

        function renderViewBasedOnStep(step) {
            const gridArea = document.getElementById("studentGrid");
            const controlsArea = document.querySelector(".controls");
            const instructionsDiv = document.getElementById("instructions");
            const roundInd = document.getElementById("roundIndicator");

            if (step === 0) {
                roundInd.innerText = "【説明 1/2】ゲームルール";
                instructionsDiv.innerHTML = `
                    <div style="background: #fff; padding: 20px; border-radius: 10px; border-top: 5px solid #2980b9; text-align: left; line-height: 1.6; font-size: 14px;">
                        <b>📋 ルール:</b><br>
                        1. 先生画面のヒントを見て病気の患者を推理しよう。<br>
                        2. 違うと思うキャラクターカードをタップして <b>❌ で消去</b>。<br>
                        3. 答えがわかったら下のメニューから選んで決定！
                    </div>
                `;
                gridArea.style.display = "none";
                controlsArea.style.display = "none";
            } else if (step === 1) {
                roundInd.innerText = "【説明 2/2】ポイントシステム";
                instructionsDiv.innerHTML = `
                    <div style="background: #fff; padding: 20px; border-radius: 10px; border-top: 5px solid #d89e00; text-align: left; line-height: 1.6; font-size: 14px;">
                        <b>⭐ ポイント & 連続ボーナス:</b><br>
                        - ヒント1: <b>4 pt</b> / ヒント2: <b>3 pt</b> / ヒント3: <b>2 pt</b> / ヒント4: <b>1 pt</b><br>
                        - 🔥 <b>連続正解ボーナス:</b> 2連続で <b>1.5倍</b>、3連続以上で <b>2倍</b> の倍率が適用されます！<br>
                        <span style="color: #e21b3c;">⚠️ 間違うと連続ボーナス（ストリーク）はリセットされます！</span>
                    </div>
                `;
                gridArea.style.display = "none";
                controlsArea.style.display = "none";
            } else {
                instructionsDiv.innerHTML = `
                    カードをタップして違う人を ❌ で消去しよう。<br>
                    <b>答えがわかったら、下のメニューからキャラクターを選んで決定ボタンを押そう！</b>
                `;
                gridArea.style.display = "grid";
                controlsArea.style.display = "flex";
                updateRoundIndicator();
                renderStudentGrid();
            }
        }

        function setGuessLock(isLocked, message) {
            const select = document.getElementById("characterSelect");
            const btn = document.querySelector(".submit-btn");
            const msg = document.getElementById("guessStatusMsg");
            
            select.disabled = isLocked;
            btn.disabled = isLocked;
            btn.style.opacity = isLocked ? "0.6" : "1";
            msg.innerText = message;
        }

        function renderStudentGrid() {
            const grid = document.getElementById("studentGrid");
            grid.innerHTML = "";
            
            if (currentStudentRound >= roundSecretNames.length) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; padding: 40px; font-size: 18px; color: #27ae60; font-weight: bold;">お疲れ様でした！全ラウンド終了です！ 🎉<br>最終スコア: ${studentScore} 点</div>`;
                document.querySelector(".controls").style.display = "none";
                return;
            }

            characters.forEach(c => {
                const card = document.createElement("div");
                card.className = `card ${eliminatedStatus[c.name] ? 'eliminated' : ''}`;
                
                card.onclick = () => {
                    eliminatedStatus[c.name] = !eliminatedStatus[c.name];
                    renderStudentGrid();
                };

                let symptomSummary = [];
                if (c.fever) symptomSummary.push("発熱");
                if (c.cough) symptomSummary.push("せき");
                if (c.soreThroat) symptomSummary.push("のど痛み");
                if (c.stomachache) symptomSummary.push("腹痛");

                card.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="avatar" style="background-color: ${c.fever ? '#ffcccc' : '#ffdcb1'}">👤</div>
                    <div class="symptoms-text">${symptomSummary.join(", ") || "健康"}</div>
                `;
                grid.appendChild(card);
            });
        }

        function submitGuess() {
            if (hasGuessedCurrentHint) return;

            const select = document.getElementById("characterSelect");
            let chosenName = select.value;

            if (!chosenName) {
                alert("キャラクターを選択してください。");
                return;
            }

            let targetName = roundSecretNames[currentStudentRound];

            if (chosenName.toLowerCase() === targetName.toLowerCase()) {
                // Base hint points (Hint 1 = 4, Hint 2 = 3, Hint 3 = 2, Hint 4 = 1)
                let basePoints = Math.max(1, 5 - (lastKnownHintIndex + 1));
                
                // Increment streak
                studentStreak++;
                
                // Calculate multiplier based on streak
                let multiplier = 1.0;
                if (studentStreak >= 3) {
                    multiplier = 2.0;
                } else if (studentStreak === 2) {
                    multiplier = 1.5;
                }
                
                let earnedPoints = Math.round(basePoints * multiplier);
                studentScore += earnedPoints;
                
                document.getElementById("scoreDisplay").innerText = studentScore;
                document.getElementById("streakDisplay").innerText = studentStreak;
                syncScore();
                
                let streakText = studentStreak > 1 ? `（🔥 ${studentStreak}連続ボーナス ${multiplier}倍適用！）` : "";
                alert(`🎉 正解！ ${targetName} が正解の患者でした！ ＋${earnedPoints}点獲得！ ${streakText}`);
                
                currentStudentRound++;
                characters.forEach(ch => eliminatedStatus[ch.name] = false);
                renderStudentGrid();
                updateRoundIndicator();
                select.value = "";
                hasGuessedCurrentHint = false;
                setGuessLock(false, "");
            } else {
                // Incorrect guess: Reset streak and lock out for this hint
                studentStreak = 0;
                document.getElementById("streakDisplay").innerText = studentStreak;
                
                hasGuessedCurrentHint = true;
                setGuessLock(true, "❌ 外れました（連続ボーナスリセット）。次のヒントをお待ちください！");
                select.value = "";
            }
        }

        function syncScore() {
            fetch('/api/update-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomPin: roomPin, playerName: playerName, score: studentScore })
            }).catch(e => console.log("Score sync failed"));
        }

        function resetBoard() {
            characters.forEach(c => eliminatedStatus[c.name] = false);
            renderStudentGrid();
        }

        initStudentBoard();
    </script>
</body>
</html>
