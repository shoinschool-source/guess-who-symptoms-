<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病気を当てよう！ - 生徒用カード</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 660px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h1 {
            color: #2b4c7e;
            margin: 0;
            font-size: 20px;
        }
        .score-board {
            background: #ffffff;
            border: 2px solid #27ae60;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #27ae60;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .round-indicator {
            font-size: 14px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 10px;
            text-align: center;
        }
        #instructions {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
            text-align: center;
            max-width: 600px;
            line-height: 1.4;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            width: 150px;
            height: 170px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card.eliminated {
            background-color: #d1d8e0;
            opacity: 0.5;
        }
        .card.eliminated::after {
            content: '❌';
            position: absolute;
            font-size: 70px;
            color: rgba(220, 50, 50, 0.7);
            top: 40px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #ffdcb1;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .symptoms-text {
            font-size: 10px;
            color: #666;
            text-align: center;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }
        button.reset-board {
            background-color: #7f8c8d;
        }
        button.reset-board:hover {
            background-color: #657374;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="score-board">🏆 スコア: <span id="scoreDisplay">0</span></div>
        <h1>患者ボード</h1>
        <div style="width: 80px;"></div>
    </div>
    
    <div class="round-indicator" id="roundIndicator">ラウンド 1 / 6</div>

    <div id="instructions">
        カードをタップして違う人を ❌ で消去しよう。<br>
        <b>答えがわかったら、正解だと思うキャラクターのカードを直接タップ！</b>
    </div>

    <div class="grid" id="studentGrid"></div>

    <div class="controls">
        <button class="reset-board" onclick="resetBoard()">ボードをリセット ❌</button>
    </div>

    <script>
        const characters = [
            { name: "Tom", fever: true, cough: false, soreThroat: false, stomachache: false },
            { name: "Anna", fever: false, cough: true, soreThroat: false, stomachache: false },
            { name: "Leo", fever: false, cough: false, soreThroat: true, stomachache: false },
            { name: "Mia", fever: false, cough: false, soreThroat: false, stomachache: true },
            { name: "Ben", fever: true, cough: true, soreThroat: false, stomachache: false },
            { name: "Sara", fever: true, cough: false, soreThroat: true, stomachache: false },
            { name: "Dan", fever: true, cough: false, soreThroat: false, stomachache: true },
            { name: "Emma", fever: false, cough: true, soreThroat: true, stomachache: false },
            { name: "Noah", fever: false, cough: true, soreThroat: false, stomachache: true },
            { name: "Zoe", fever: false, cough: false, soreThroat: true, stomachache: true },
            { name: "Liam", fever: true, cough: true, soreThroat: true, stomachache: false },
            { name: "Olivia", fever: true, cough: true, soreThroat: false, stomachache: true },
            { name: "Lucas", fever: true, cough: false, soreThroat: true, stomachache: true },
            { name: "Chloe", fever: false, cough: true, soreThroat: true, stomachache: true },
            { name: "Mason", fever: true, cough: true, soreThroat: true, stomachache: true },
            { name: "Ava", fever: false, cough: false, soreThroat: false, stomachache: false }
        ];

        let roundSecretNames = [];
        let currentStudentRound = 0;
        let eliminatedStatus = {};
        let studentScore = 0;

        function initStudentBoard() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('rounds')) {
                let rawRounds = urlParams.get('rounds');
                roundSecretNames = rawRounds.split(",").map(n => n.trim());
            } else {
                roundSecretNames = ["Tom", "Anna", "Leo", "Mia", "Ben", "Sara"];
            }

            currentStudentRound = 0;
            studentScore = 0;
            document.getElementById("scoreDisplay").innerText = studentScore;
            
            resetBoardState();
        }

        function resetBoardState() {
            characters.forEach(c => eliminatedStatus[c.name] = false);
            renderStudentGrid();
            updateRoundIndicator();
        }

        function updateRoundIndicator() {
            let indicator = document.getElementById("roundIndicator");
            if (currentStudentRound < roundSecretNames.length) {
                indicator.innerText = `ラウンド ${currentStudentRound + 1} / ${roundSecretNames.length}`;
            } else {
                indicator.innerText = `🏆 全ラウンド終了！ 最終スコア: ${studentScore} 点`;
            }
        }

        function renderStudentGrid() {
            const grid = document.getElementById("studentGrid");
            grid.innerHTML = "";
            
            if (currentStudentRound >= roundSecretNames.length) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; padding: 40px; font-size: 18px; color: #27ae60; font-weight: bold;">お疲れ様でした！全ラウンド終了です！ 🎉<br>スコア: ${studentScore} 点</div>`;
                return;
            }

            characters.forEach(c => {
                const card = document.createElement("div");
                card.className = `card ${eliminatedStatus[c.name] ? 'eliminated' : ''}`;
                
                card.onclick = () => {
                    let targetName = roundSecretNames[currentStudentRound];

                    if (c.name.toLowerCase() === targetName.toLowerCase()) {
                        studentScore += 1;
                        document.getElementById("scoreDisplay").innerText = studentScore;
                        alert(`🎉 正解！ ${targetName} が正解の患者でした！ ＋1点獲得！`);
                        
                        currentStudentRound++;
                        characters.forEach(ch => eliminatedStatus[ch.name] = false);
                        renderStudentGrid();
                        updateRoundIndicator();
                    } else {
                        eliminatedStatus[c.name] = !eliminatedStatus[c.name];
                        renderStudentGrid();
                    }
                };

                let symptomSummary = [];
                if (c.fever) symptomSummary.push("発熱");
                if (c.cough) symptomSummary.push("せき");
                if (c.soreThroat) symptomSummary.push("のどの痛み");
                if (c.stomachache) symptomSummary.push("腹痛");

                card.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="avatar" style="background-color: ${c.fever ? '#ffcccc' : '#ffdcb1'}">
                        👤
                    </div>
                    <div class="symptoms-text">${symptomSummary.join(", ") || "健康"}</div>
                `;
                grid.appendChild(card);
            });
        }

        function resetBoard() {
            characters.forEach(c => eliminatedStatus[c.name] = false);
            renderStudentGrid();
        }

        initStudentBoard();
    </script>
</body>
</html>
