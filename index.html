<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Illness - Teacher Call Edition (16 Patients)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2b4c7e;
            margin-bottom: 5px;
            text-align: center;
        }
        #status {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
            background: #e2ebf5;
            padding: 10px 20px;
            border-radius: 8px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            width: 150px;
            height: 170px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card.eliminated {
            background-color: #d1d8e0;
            opacity: 0.6;
        }
        .card.eliminated::after {
            content: '❌';
            position: absolute;
            font-size: 70px;
            color: rgba(220, 50, 50, 0.7);
            top: 40px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #ffdcb1;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .symptoms-text {
            font-size: 10px;
            color: #666;
            text-align: center;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 750px;
        }
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1f618d;
        }
        button.guess-btn {
            background-color: #27ae60;
        }
        button.guess-btn:hover {
            background-color: #1e8449;
        }
    </style>
</head>
<body>

    <h1>Guess the Illness (Teacher Call Edition)</h1>
    <div id="status">Listen to the teacher's clue and click cards that do NOT match to cross them out!</div>

    <div class="grid" id="gameGrid"></div>

    <div class="controls">
        <button onclick="teacherCall('fever')">Teacher: "Who has a fever?"</button>
        <button onclick="teacherCall('cough')">Teacher: "Who has a cough?"</button>
        <button onclick="teacherCall('soreThroat')">Teacher: "Who has a sore throat?"</button>
        <button onclick="teacherCall('stomachache')">Teacher: "Who has a stomachache?"</button>
        <button class="guess-btn" onclick="makeGuess()">Make Final Guess!</button>
        <button onclick="resetGame()" style="background-color: #7f8c8d;">New Round</button>
    </div>

    <script>
        const characters = [
            { name: "Tom", fever: true, cough: false, soreThroat: false, stomachache: false },
            { name: "Anna", fever: false, cough: true, soreThroat: false, stomachache: false },
            { name: "Leo", fever: false, cough: false, soreThroat: true, stomachache: false },
            { name: "Mia", fever: false, cough: false, soreThroat: false, stomachache: true },
            { name: "Ben", fever: true, cough: true, soreThroat: false, stomachache: false },
            { name: "Sara", fever: true, cough: false, soreThroat: true, stomachache: false },
            { name: "Dan", fever: true, cough: false, soreThroat: false, stomachache: true },
            { name: "Emma", fever: false, cough: true, soreThroat: true, stomachache: false },
            { name: "Noah", fever: false, cough: true, soreThroat: false, stomachache: true },
            { name: "Zoe", fever: false, cough: false, soreThroat: true, stomachache: true },
            { name: "Liam", fever: true, cough: true, soreThroat: true, stomachache: false },
            { name: "Olivia", fever: true, cough: true, soreThroat: false, stomachache: true },
            { name: "Lucas", fever: true, cough: false, soreThroat: true, stomachache: true },
            { name: "Chloe", fever: false, cough: true, soreThroat: true, stomachache: true },
            { name: "Mason", fever: true, cough: true, soreThroat: true, stomachache: true },
            { name: "Ava", fever: false, cough: false, soreThroat: false, stomachache: false }
        ];

        let secretPatient;
        let roundsCalled = 0;
        let eliminatedStatus = {};

        function initGame() {
            secretPatient = characters[Math.floor(Math.random() * characters.length)];
            roundsCalled = 0;
            characters.forEach(c => eliminatedStatus[c.name] = false);
            document.getElementById("status").innerText = "New round started! Teacher is ready to call the first symptom.";
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById("gameGrid");
            grid.innerHTML = "";
            characters.forEach(c => {
                const card = document.createElement("div");
                card.className = `card ${eliminatedStatus[c.name] ? 'eliminated' : ''}`;
                card.onclick = () => toggleCard(c.name);

                let symptomSummary = [];
                if (c.fever) symptomSummary.push("Fever");
                if (c.cough) symptomSummary.push("Cough");
                if (c.soreThroat) symptomSummary.push("Sore Throat");
                if (c.stomachache) symptomSummary.push("Stomachache");

                card.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="avatar" style="background-color: ${c.fever ? '#ffcccc' : '#ffdcb1'}">
                        👤
                    </div>
                    <div class="symptoms-text">${symptomSummary.join(", ") || "Healthy"}</div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleCard(name) {
            eliminatedStatus[name] = !eliminatedStatus[name];
            renderGrid();
        }

        function teacherCall(symptomKey) {
            roundsCalled++;
            const hasSymptom = secretPatient[symptomKey];
            
            // Format readable symptom labels for text output
            const labels = {
                'fever': 'fever',
                'cough': 'cough',
                'soreThroat': 'sore throat',
                'stomachache': 'stomachache'
            };
            const symptomName = labels[symptomKey];

            const clueText = hasSymptom ? 
                `Teacher Clue #${roundsCalled}: "The patient HAS a ${symptomName}." (Cross out anyone WITHOUT it!)` : 
                `Teacher Clue #${roundsCalled}: "The patient does NOT have a ${symptomName}." (Cross out anyone WITH it!)`;
