<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病気を当てよう！ - ルーム作成</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fb;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 { color: #2b4c7e; margin: 0; font-size: 24px; }
        h2 { font-size: 16px; color: #2b4c7e; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 8px; text-align: left; }
        
        .pin-box {
            background: #eef9ff;
            border: 2px dashed #2980b9;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #2980b9;
        }
        .qr-container img {
            width: 160px;
            height: 160px;
            border: 4px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        
        .roster-panel {
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
        }
        .student-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        .student-item {
            padding: 6px 10px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .student-item:nth-child(odd) { background-color: #fafafa; }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background-color: #27ae60;
            transition: background 0.2s;
        }
        button:hover { background-color: #219653; }
        .link-text { font-size: 11px; color: #666; word-break: break-all; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🩺 医療ゲーム ホスト</h1>
        <p style="color: #666; font-size: 13px; margin: 0;">生徒に下のQRコードを読み込んでもらいましょう！</p>
        
        <div class="pin-box">
            ルーム PIN: <span id="pinDisplay">----</span>
        </div>

        <div class="qr-container">
            <img id="qrCodeImg" src="" alt="Student QR Code">
        </div>

        <div class="link-text">
            <a id="studentLinkText" href="#" target="_blank">生徒用リンクを開く</a>
        </div>

        <!-- Live Student Roster Panel -->
        <div class="roster-panel">
            <h2>👥 参加中の生徒 (<span id="studentCount">0</span>人)</h2>
            <ul class="student-list" id="studentList">
                <li class="student-item" style="color: #888;">生徒の参加待ち...</li>
            </ul>
        </div>

        <button onclick="launchTeacherDashboard()">ゲーム画面（ダッシュボード）へ進む 🚀</button>
    </div>

    <script>
        const characters = [
            { name: "Tom", fever: true, cough: false, soreThroat: false, stomachache: false },
            { name: "Anna", fever: false, cough: true, soreThroat: false, stomachache: false },
            { name: "Leo", fever: false, cough: false, soreThroat: true, stomachache: false },
            { name: "Mia", fever: false, cough: false, soreThroat: false, stomachache: true },
            { name: "Ben", fever: true, cough: true, soreThroat: false, stomachache: false },
            { name: "Sara", fever: true, cough: false, soreThroat: true, stomachache: false },
            { name: "Dan", fever: true, cough: false, soreThroat: false, stomachache: true },
            { name: "Emma", fever: false, cough: true, soreThroat: true, stomachache: false },
            { name: "Noah", fever: false, cough: true, soreThroat: false, stomachache: true },
            { name: "Zoe", fever: false, cough: false, soreThroat: true, stomachache: true },
            { name: "Liam", fever: true, cough: true, soreThroat: true, stomachache: false },
            { name: "Olivia", fever: true, cough: true, soreThroat: false, stomachache: true },
            { name: "Lucas", fever: true, cough: false, soreThroat: true, stomachache: true },
            { name: "Chloe", fever: false, cough: true, soreThroat: true, stomachache: true },
            { name: "Mason", fever: true, cough: true, soreThroat: true, stomachache: true },
            { name: "Ava", fever: false, cough: false, soreThroat: false, stomachache: false }
        ];

        let roomPin = "";
        let roundsStr = "";

        function initIndex() {
            roomPin = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById("pinDisplay").innerText = roomPin;

            let shuffled = [...characters].sort(() => 0.5 - Math.random());
            let roundsData = shuffled.slice(0, 6);
            roundsStr = roundsData.map(r => r.name).join(",");

            let baseUrl = window.location.origin + window.location.pathname.replace('index.html', 'student_card.html');
            let studentUrl = `${baseUrl}?pin=${roomPin}&rounds=${encodeURIComponent(roundsStr)}`;

            document.getElementById("studentLinkText").href = studentUrl;
            document.getElementById("studentLinkText").innerText = studentUrl;

            let qrImg = document.getElementById("qrCodeImg");
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(studentUrl)}`;

            // Start polling the leaderboard endpoint to show joined students in real time
            setInterval(fetchStudents, 2000);
        }

        async function fetchStudents() {
            try {
                let res = await fetch(`/api/get-leaderboard?roomPin=${roomPin}`);
                let leaderboard = await res.json();
                
                const list = document.getElementById("studentList");
                const countBadge = document.getElementById("studentCount");
                list.innerHTML = "";
                
                if (!Array.isArray(leaderboard) || leaderboard.length === 0) {
                    list.innerHTML = `<li class="student-item" style="color: #888;">生徒の参加待ち...</li>`;
                    countBadge.innerText = "0";
                    return;
                }

                let validStudents = leaderboard.filter(player => !player.name.startsWith("__"));
                countBadge.innerText = validStudents.length;

                if (validStudents.length === 0) {
                    list.innerHTML = `<li class="student-item" style="color: #888;">生徒の参加待ち...</li>`;
                    return;
                }

                validStudents.forEach(player => {
                    let li = document.createElement("li");
                    li.className = "student-item";
                    li.innerHTML = `<span>👤 ${player.name}</span><span style="color: #27ae60; font-weight: bold;">参加中 ✅</span>`;
                    list.appendChild(li);
                });
            } catch(e) {
                console.log("Failed to fetch students");
            }
        }

        function launchTeacherDashboard() {
            window.location.href = `teacher_game.html?pin=${roomPin}&rounds=${encodeURIComponent(roundsStr)}`;
        }

        initIndex();
    </script>
</body>
</html>
