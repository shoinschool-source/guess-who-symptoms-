<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Illness - Teacher Control Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2b4c7e;
            margin-bottom: 5px;
            text-align: center;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .header-info {
            flex-grow: 1;
        }
        .qr-box {
            background: #fff;
            padding: 8px;
            border: 2px solid #2b4c7e;
            border-radius: 8px;
            text-align: center;
        }
        .qr-box span {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #2b4c7e;
            margin-bottom: 5px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
        }
        #status {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
            background: #e2ebf5;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            width: 150px;
            height: 170px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card.eliminated {
            background-color: #d1d8e0;
            opacity: 0.6;
        }
        .card.eliminated::after {
            content: '❌';
            position: absolute;
            font-size: 70px;
            color: rgba(220, 50, 50, 0.7);
            top: 40px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #ffdcb1;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .symptoms-text {
            font-size: 10px;
            color: #666;
            text-align: center;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 900px;
        }
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1f618d;
        }
        button.guess-btn {
            background-color: #27ae60;
        }
        button.guess-btn:hover {
            background-color: #1e8449;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-info">
            <h1>Guess the Illness</h1>
            <p style="margin: 0; color: #666; font-size: 13px;">Teacher Control Panel & Secret Patient Board</p>
        </div>
        <div class="qr-box">
            <span>SCAN FOR STUDENT BOARD</span>
            <div id="qrcode"></div>
        </div>
    </div>

    <div id="status">New round started! Teacher is ready to call the first symptom.</div>

    <div class="grid" id="gameGrid"></div>

    <div class="controls">
        <button onclick="teacherCall('fever')">Teacher: "Who has a fever?"</button>
        <button onclick="teacherCall('cough')">Teacher: "Who has a cough?"</button>
        <button onclick="teacherCall('soreThroat')">Teacher: "Who has a sore throat?"</button>
        <button onclick="teacherCall('stomachache')">Teacher: "Who has a stomachache?"</button>
        <button class="guess-btn" onclick="makeGuess()">Make Final Guess!</button>
        <button onclick="resetGame()" style="background-color: #7f8c8d;">New Round</button>
    </div>

    <script>
        const characters = [
            { name: "Tom", fever: true, cough: false, soreThroat: false, stomachache: false },
            { name: "Anna", fever: false, cough: true, soreThroat: false, stomachache: false },
            { name: "Leo", fever: false, cough: false, soreThroat: true, stomachache: false },
            { name: "Mia", fever: false, cough: false, soreThroat: false, stomachache: true },
            { name: "Ben", fever: true, cough: true, soreThroat: false, stomachache: false },
            { name: "Sara", fever: true, cough: false, soreThroat: true, stomachache: false },
            { name: "Dan", fever: true, cough: false, soreThroat: false, stomachache: true },
            { name: "Emma", fever: false, cough: true, soreThroat: true, stomachache: false },
            { name: "Noah", fever: false, cough: true, soreThroat: false, stomachache: true },
            { name: "Zoe", fever: false, cough: false, soreThroat: true, stomachache: true },
            { name: "Liam", fever: true, cough: true, soreThroat: true, stomachache: false },
            { name: "Olivia", fever: true, cough: true, soreThroat: false, stomachache: true },
            { name: "Lucas", fever: true, cough: false, soreThroat: true, stomachache: true },
            { name: "Chloe", fever: false, cough: true, soreThroat: true, stomachache: true },
            { name: "Mason", fever: true, cough: true, soreThroat: true, stomachache: true },
            { name: "Ava", fever: false, cough: false, soreThroat: false, stomachache: false }
        ];

        let secretPatient;
        let roundsCalled = 0;
        let eliminatedStatus = {};

        // Generate QR code pointing to the student page link (Change URL in quotes if hosted online)
        function generateQRCode() {
            document.getElementById("qrcode").innerHTML = "";
            // By default, it encodes the student page URL. If hosting both files together, 
            // you can point this to your deployed student link or local file path.
            let studentUrl = window.location.href.replace("teacher_game.html", "student_card.html");
            
            new QRCode(document.getElementById("qrcode"), {
                text: studentUrl,
                width: 90,
                height: 90,
                colorDark: "#2b4c7e",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function initGame() {
            secretPatient = characters[Math.floor(Math.random() * characters.length)];
            roundsCalled = 0;
            characters.forEach(c => eliminatedStatus[c.name] = false);
            document.getElementById("status").innerText = "New round started! Teacher is ready to call the first symptom.";
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById("gameGrid");
            grid.innerHTML = "";
            characters.forEach(c => {
                const card = document.createElement("div");
                card.className = `card ${eliminatedStatus[c.name] ? 'eliminated' : ''}`;
                card.onclick = () => toggleCard(c.name);

                let symptomSummary = [];
                if (c.fever) symptomSummary.push("Fever");
                if (c.cough) symptomSummary.push("Cough");
                if (c.soreThroat) symptomSummary.push("Sore Throat");
                if (c.stomachache) symptomSummary.push("Stomachache");

                card.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="avatar" style="background-color: ${c.fever ? '#ffcccc' : '#ffdcb1'}">
                        👤
                    </div>
                    <div class="symptoms-text">${symptomSummary.join(", ") || "Healthy"}</div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleCard(name) {
            eliminatedStatus[name] = !eliminatedStatus[name];
            renderGrid();
        }

        function teacherCall(symptomKey) {
            roundsCalled++;
            const hasSymptom = secretPatient[symptomKey];
            
            const labels = {
                'fever': 'fever',
                'cough': 'cough',
                'soreThroat': 'sore throat',
                'stomachache': 'stomachache'
            };
            const symptomName = labels[symptomKey];

            const clueText = hasSymptom ? 
                `Teacher Clue #${roundsCalled}: "The patient HAS a ${symptomName}." (Cross out anyone WITHOUT it!)` : 
                `Teacher Clue #${roundsCalled}: "The patient does NOT have a ${symptomName}." (Cross out anyone WITH it!)`;
            
            document.getElementById("status").innerText = clueText;
        }

        function makeGuess() {
            const activeCharacters = characters.filter(c => !eliminatedStatus[c.name]);
            if (activeCharacters.length === 0) {
                alert("All cards are crossed out! Click a card to uncross it.");
                return;
            }

            let choice = prompt(`Who is your final guess?\nRemaining suspects: ${activeCharacters.map(c => c.name).join(", ")}`);
            if (!choice) return;

            choice = choice.trim().toLowerCase();
            const matched = characters.find(c => c.name.toLowerCase() === choice);

            if (!matched) {
                alert("Please type an exact name from the board.");
                return;
            }

            if (matched.name === secretPatient.name) {
                alert(`🎉 Correct! The secret patient was ${secretPatient.name}! Great listening practice.`);
                initGame();
            } else {
                alert(`❌ Incorrect! The secret patient was actually ${secretPatient.name}. Try again!`);
                initGame();
            }
        }

        // Initialize game and QR code on load
        window.onload = function() {
            initGame();
            generateQRCode();
        };
    </script>
</body>
</html>
