<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Illness - Teacher Control Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2b4c7e;
            margin-bottom: 5px;
            text-align: center;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .header-info {
            flex-grow: 1;
        }
        .qr-box {
            background: #fff;
            padding: 8px;
            border: 2px solid #2b4c7e;
            border-radius: 8px;
            text-align: center;
        }
        .qr-box span {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #2b4c7e;
            margin-bottom: 5px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
        }
        #status {
            font-size: 17px;
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
            background: #e2ebf5;
            padding: 14px 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            border-left: 6px solid #2980b9;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            width: 150px;
            height: 170px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card.eliminated {
            background-color: #d1d8e0;
            opacity: 0.6;
        }
        .card.eliminated::after {
            content: '❌';
            position: absolute;
            font-size: 70px;
            color: rgba(220, 50, 50, 0.7);
            top: 40px;
        }
        .card.secret-highlight {
            border: 3px solid #27ae60;
            background-color: #e9f7ef;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #ffdcb1;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .symptoms-text {
            font-size: 10px;
            color: #666;
            text-align: center;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 900px;
        }
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1f618d;
        }
        button.next-btn {
            background-color: #d35400;
        }
        button.next-btn:hover {
            background-color: #ba4a00;
        }
        button.guess-btn {
            background-color: #27ae60;
        }
        button.guess-btn:hover {
            background-color: #1e8449;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="header-info">
            <h1>Guess the Illness</h1>
            <p style="margin: 0; color: #666; font-size: 13px;">Teacher Control Panel (Hint Sequencer Mode)</p>
        </div>
        <div class="qr-box">
            <span>SCAN FOR STUDENT BOARD</span>
            <div id="qrcode"></div>
        </div>
    </div>

    <div id="status">Loading round...</div>

    <div class="grid" id="gameGrid"></div>

    <div class="controls">
        <button class="next-btn" onclick="nextHint()">➡️ Next Hint</button>
        <button class="guess-btn" onclick="makeGuess()">Make Final Guess!</button>
        <button onclick="resetGame()" style="background-color: #7f8c8d;">New Round</button>
    </div>

    <script>
        const characters = [
            { name: "Tom", fever: true, cough: false, soreThroat: false, stomachache: false },
            { name: "Anna", fever: false, cough: true, soreThroat: false, stomachache: false },
            { name: "Leo", fever: false, cough: false, soreThroat: true, stomachache: false },
            { name: "Mia", fever: false, cough: false, soreThroat: false, stomachache: true },
            { name: "Ben", fever: true, cough: true, soreThroat: false, stomachache: false },
            { name: "Sara", fever: true, cough: false, soreThroat: true, stomachache: false },
            { name: "Dan", fever: true, cough: false, soreThroat: false, stomachache: true },
            { name: "Emma", fever: false, cough: true, soreThroat: true, stomachache: false },
            { name: "Noah", fever: false, cough: true, soreThroat: false, stomachache: true },
            { name: "Zoe", fever: false, cough: false, soreThroat: true, stomachache: true },
            { name: "Liam", fever: true, cough: true, soreThroat: true, stomachache: false },
            { name: "Olivia", fever: true, cough: true, soreThroat: false, stomachache: true },
            { name: "Lucas", fever: true, cough: false, soreThroat: true, stomachache: true },
            { name: "Chloe", fever: false, cough: true, soreThroat: true, stomachache: true },
            { name: "Mason", fever: true, cough: true, soreThroat: true, stomachache: true },
            { name: "Ava", fever: false, cough: false, soreThroat: false, stomachache: false }
        ];

        let secretPatient;
        let secretSymptomsList = [];
        let currentHintIndex = 0;
        let eliminatedStatus = {};

        function generateQRCode() {
            document.getElementById("qrcode").innerHTML = "";
            let studentUrl = window.location.href.replace("teacher_game.html", "student_card.html");
            
            new QRCode(document.getElementById("qrcode"), {
                text: studentUrl,
                width: 90,
                height: 90,
                colorDark: "#2b4c7e",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function initGame() {
            // Pick a random secret patient
            secretPatient = characters[Math.floor(Math.random() * characters.length)];
            
            // Compile a list of descriptive statements for this specific secret character
            secretSymptomsList = [];
            if (secretPatient.fever) secretSymptomsList.push("The patient has a **fever**.");
            else secretSymptomsList.push("The patient does **not** have a fever.");

            if (secretPatient.cough) secretSymptomsList.push("The patient has a **cough**.");
            else secretSymptomsList.push("The patient does **not** have a cough.");

            if (secretPatient.soreThroat) secretSymptomsList.push("The patient has a **sore throat**.");
            else secretSymptomsList.push("The patient does **not** have a sore throat.");

            if (secretPatient.stomachache) secretSymptomsList.push("The patient has a **stomachache**.");
            else secretSymptomsList.push("The patient does **not** have a stomachache.");

            currentHintIndex = 0;
            characters.forEach(c => eliminatedStatus[c.name] = false);
            
            updateStatusDisplay();
            renderGrid();
        }

        function updateStatusDisplay() {
            let totalHints = secretSymptomsList.length;
            let hintText = secretSymptomsList[currentHintIndex];
            document.getElementById("status").innerHTML = 
                `🔒 Secret Patient: <b>[ Hidden until end ]</b> &nbsp;|&nbsp; Hint (${currentHintIndex + 1}/${totalHints}): <br><span style="font-size: 19px; color: #1b4f72;">"${hintText}"</span>`;
        }

        function nextHint() {
            if (currentHintIndex < secretSymptomsList.length - 1) {
                currentHintIndex++;
                updateStatusDisplay();
            } else {
                alert("You have reached the final hint for this character! Click 'Make Final Guess!' when ready.");
            }
        }

        function renderGrid() {
            const grid = document.getElementById("gameGrid");
            grid.innerHTML = "";
            characters.forEach(c => {
                const card = document.createElement("div");
                let extraClass = eliminatedStatus[c.name] ? 'eliminated' : '';
                
                card.className = `card ${extraClass}`;
                card.onclick = () => {
                    eliminatedStatus[c.name] = !eliminatedStatus[c.name];
                    renderGrid();
                };

                let symptomSummary = [];
                if (c.fever) symptomSummary.push("Fever");
                if (c.cough) symptomSummary.push("Cough");
                if (c.soreThroat) symptomSummary.push("Sore Throat");
                if (c.stomachache) symptomSummary.push("Stomachache");

                card.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="avatar" style="background-color: ${c.fever ? '#ffcccc' : '#ffdcb1'}">
                        👤
                    </div>
                    <div class="symptoms-text">${symptomSummary.join(", ") || "Healthy"}</div>
                `;
                grid.appendChild(card);
            });
        }

        function makeGuess() {
            const activeCharacters = characters.filter(c => !eliminatedStatus[c.name]);
            if (activeCharacters.length === 0) {
                alert("All cards are crossed out! Click a card to uncross it.");
                return;
            }

            let choice = prompt(`Who is your final guess?\nRemaining suspects: ${activeCharacters.map(c => c.name).join(", ")}`);
            if (!choice) return;

            choice = choice.trim().toLowerCase();
            const matched = characters.find(c => c.name.toLowerCase() === choice);

            if (!matched) {
                alert("Please type an exact name from the board.");
                return;
            }

            if (matched.name === secretPatient.name) {
                alert(`🎉 Correct! The secret patient was indeed ${secretPatient.name}!`);
                initGame();
            } else {
                alert(`❌ Incorrect! The secret patient was actually ${secretPatient.name}.`);
                initGame();
            }
        }

        window.onload = function() {
            initGame();
            generateQRCode();
        };
    </script>
</body>
</html>
