<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Illness - Student Game Card & Score</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            max-width: 660px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h1 {
            color: #2b4c7e;
            margin: 0;
            font-size: 20px;
        }
        .score-board {
            background: #ffffff;
            border: 2px solid #27ae60;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #27ae60;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .round-indicator {
            font-size: 14px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 15px;
            text-align: center;
        }
        #instructions {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
            text-align: center;
            max-width: 600px;
            line-height: 1.4;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 150px);
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            width: 150px;
            height: 170px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card.eliminated {
            background-color: #d1d8e0;
            opacity: 0.5;
        }
        .card.eliminated::after {
            content: '❌';
            position: absolute;
            font-size: 70px;
            color: rgba(220, 50, 50, 0.7);
            top: 40px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #ffdcb1;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .symptoms-text {
            font-size: 10px;
            color: #666;
            text-align: center;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }
        button.reset-board {
            background-color: #7f8c8d;
        }
        button.reset-board:hover {
            background-color: #657374;
        }
        button.claim-btn {
            background-color: #27ae60;
        }
        button.claim-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="score-board">🏆 Score: <span id="scoreDisplay">0</span></div>
        <h1>My Patient Board</h1>
        <div style="width: 80px;"></div>
    </div>
    
    <div class="round-indicator" id="roundIndicator">Round 1 of 6</div>

    <div id="instructions">
        Listen to the teacher's clues and click cards to cross out ❌ mismatches.<br>
        <i>Guessed correctly? Click "Claim Point" to log your point and advance to the next round!</i>
    </div>

    <div class="grid" id="studentGrid"></div>

    <div class="controls">
        <button class="claim-btn" onclick="claimPoint()">⭐ Claim Point (+1)</button>
        <button class="reset-board" onclick="resetBoard()">Reset Board</button>
    </div>

    <script>
        const characters = [
            { name: "Tom", fever: true, cough: false, soreThroat: false, stomachache: false },
            { name: "Anna", fever: false, cough: true, soreThroat: false, stomachache: false },
            { name: "Leo", fever: false, cough: false, soreThroat: true, stomachache: false },
            { name: "Mia", fever: false, cough: false, soreThroat: false, stomachache: true },
            { name: "Ben", fever: true, cough: true, soreThroat: false, stomachache: false },
            { name: "Sara", fever: true, cough: false, soreThroat: true, stomachache: false },
            { name: "Dan", fever: true, cough: false, soreThroat: false, stomachache: true },
            { name: "Emma", fever: false, cough: true, soreThroat: true, stomachache: false },
            { name: "Noah", fever: false, cough: true, soreThroat: false, stomachache: true },
            { name: "Zoe", fever: false, cough: false, soreThroat: true, stomachache: true },
            { name: "Liam", fever: true, cough: true, soreThroat: true, stomachache: false },
            { name: "Olivia", fever: true, cough: true, soreThroat: false, stomachache: true },
            { name: "Lucas", fever: true, cough: false, soreThroat: true, stomachache: true },
            { name: "Chloe", fever: false, cough: true, soreThroat: true, stomachache: true },
            { name: "Mason", fever: true, cough: true, soreThroat: true, stomachache: true },
            { name: "Ava", fever: false, cough: false, soreThroat: false, stomachache: false }
        ];

        let roundSecretNames = [];
        let currentStudentRound = 0;
        let eliminatedStatus = {};
        let studentScore = 0;

        function initStudentBoard() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('rounds')) {
                roundSecretNames = urlParams.get('rounds').split(",");
            } else {
                // Fallback if opened directly
                roundSecretNames = ["Tom", "Anna", "Leo", "Mia", "Ben", "Sara"];
            }

            characters.forEach(c => eliminatedStatus[c.name] = false);
            renderStudentGrid();
            updateRoundIndicator();
        }

        function updateRoundIndicator() {
            let indicator = document.getElementById("roundIndicator");
            if (currentStudentRound < roundSecretNames.length) {
                indicator.innerText = `Round ${currentStudentRound + 1} of ${roundSecretNames.length}`;
            } else {
                indicator.innerText = `🎉 All 6 Rounds Finished! Final Score: ${studentScore}`;
            }
        }

        function renderStudentGrid() {
            const grid = document.getElementById("studentGrid");
            grid.innerHTML = "";
            characters.forEach(c => {
                const card = document.createElement("div");
                card.className = `card ${eliminatedStatus[c.name] ? 'eliminated' : ''}`;
                card.onclick = () => {
                    eliminatedStatus[c.name] = !eliminatedStatus[c.name];
                    renderStudentGrid();
                };

                let symptomSummary = [];
                if (c.fever) symptomSummary.push("Fever");
                if (c.cough) symptomSummary.push("Cough");
                if (c.soreThroat) symptomSummary.push("Sore Throat");
                if (c.stomachache) symptomSummary.push("Stomachache");

                card.innerHTML = `
                    <div class="name">${c.name}</div>
                    <div class="avatar" style="background-color: ${c.fever ? '#ffcccc' : '#ffdcb1'}">
                        👤
                    </div>
                    <div class="symptoms-text">${symptomSummary.join(", ") || "Healthy"}</div>
                `;
                grid.appendChild(card);
            });
        }

        function claimPoint() {
            if (currentStudentRound >= roundSecretNames.length) {
                alert("You have already finished all 6 rounds!");
                return;
            }

            let targetName = roundSecretNames[currentStudentRound];
            let guess = prompt(`Round ${currentStudentRound + 1}: Enter the name of the character you think is the secret patient:`);
            if (!guess) return;

            guess = guess.trim().toLowerCase();
            if (guess === targetName.toLowerCase()) {
                studentScore += 1;
                document.getElementById("scoreDisplay").innerText = studentScore;
                alert(`🎉 Correct! The secret patient was indeed ${targetName}. You earned +1 point!`);
                
                // Advance to the next round automatically
                currentStudentRound++;
                characters.forEach(c => eliminatedStatus[c.name] = false);
                renderStudentGrid();
                updateRoundIndicator();
            } else {
                alert(`❌ Incorrect! The secret patient for this round was someone else. Keep trying or wait for the next round!`);
            }
        }

        function resetBoard() {
            characters.forEach(c => eliminatedStatus[c.name] = false);
            renderStudentGrid();
        }

        initStudentBoard();
    </script>
</body>
</html>
